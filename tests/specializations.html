<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>TopDownSoloRPG specialization checks</title></head>
<body>
  <h1>Specialization checks</h1>
  <pre id="test-results" role="status">Running checks in an isolated game frame…</pre>
  <iframe id="test-game" src="../index.html" title="Game under test" style="width:100%;height:80vh;border:0"></iframe>
  <script type="module">
    const frame = document.getElementById("test-game");
    let started = false;
    function run() {
      if (started) return;
      started = true;
      const script = frame.contentDocument.createElement("script");
      script.type = "module";
      script.src = new URL("./specialization-checks.js", import.meta.url).href;
      script.addEventListener("error", () => {
        document.getElementById("test-results").textContent = "FAIL: a module could not load. See the browser console.";
        document.body.dataset.result = "FAIL";
      });
      frame.contentDocument.body.appendChild(script);
    }
    frame.addEventListener("load", run);
    if (frame.contentDocument?.readyState === "complete" && frame.contentDocument.URL.endsWith("/index.html")) run();
    window.addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || event.origin !== location.origin || event.data?.type !== "smoke-results") return;
      document.getElementById("test-results").textContent = event.data.result;
      document.body.dataset.result = event.data.passed ? "PASS" : "FAIL";
    });
  </script>
</body>
</html>
